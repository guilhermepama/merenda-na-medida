{% extends "base.html" %}
{% block titulo %}Criar conta — Merenda na Medida{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Criar conta</h1>
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100">Cadastrar</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
